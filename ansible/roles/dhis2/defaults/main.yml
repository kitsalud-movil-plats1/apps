---
# Ruta del Compose en clinica01 y de los datos (disco de datos, /srv)
dhis2_dir: /srv/dhis2
dhis2_db_nombre: dhis2
dhis2_db_usuario: dhis
# Usuario con el que corre la imagen dhis2/core (nobody)
dhis2_uid: 65534
# started: docker compose up -d; stopped: docker compose down (los datos se conservan)
dhis2_estado: started
# Archivos del repositorio apps que se copian tal cual
dhis2_fuente: "{{ role_path }}/../../../clinica01/dhis2"

# API local de DHIS2 (la configuración se hace desde la VM, sin pasar por Caddy)
dhis2_api: http://127.0.0.1:8080/api
# UID fijos de metadatos/kit.json
dhis2_ou: KitSalud001
dhis2_grupo: GrpPersCli1
dhis2_programa: ProgAtenPr1
# Clave de fábrica de admin, solo para cambiarla en el primer arranque
dhis2_admin_fabrica: district

# Red de Docker de DHIS2 (pg_hba.conf solo acepta a dhis desde ella). La ULA es
# propia de la red de Docker, fuera de la del kit.
dhis2_red4: 172.30.0.0/24
dhis2_red6: fdc4:5a1d:7e20:1::/64

# Base y usuario de los formularios de prerregistro (apps#6)
dhis2_prerregistro_db: prerregistro
dhis2_prerregistro_usuario: formularios
