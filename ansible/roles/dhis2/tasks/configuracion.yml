---
# Configuración por la API: clave de admin, metadatos del kit, cuentas del
# personal y pacientes ficticios (S-09). Cada paso solo actúa si hace falta.
- name: Esperar a que DHIS2 responda
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/system/ping"
    status_code: 200
  register: dhis2_ping
  until: dhis2_ping.status == 200
  retries: 60
  delay: 10

- name: Clave de admin vigente
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/me?fields=id"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: dhis2_admin_me
  no_log: true

- name: Cambiar la clave de fábrica de admin por la del vault
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/me/changePassword"
    method: PUT
    url_username: admin
    url_password: "{{ dhis2_admin_fabrica }}"
    force_basic_auth: true
    body_format: json
    body: { oldPassword: "{{ dhis2_admin_fabrica }}", newPassword: "{{ dhis2_admin_password }}" }
    status_code: [200, 202, 204]
  when: dhis2_admin_me.status == 401
  changed_when: true
  no_log: true

- name: Metadatos del kit en la VM
  ansible.builtin.copy:
    src: "{{ dhis2_fuente }}/metadatos/kit.json"
    dest: "{{ dhis2_dir }}/kit.json"
    owner: root
    group: root
    mode: "0644"
  register: dhis2_kit_json

- name: Programa del kit presente
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/programs/{{ dhis2_programa }}?fields=id"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: dhis2_programa_hoy
  no_log: true

# Se importa si cambió el archivo o si falta el programa (base nueva)
- name: Importar los metadatos del kit
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/metadata?importStrategy=CREATE_AND_UPDATE&atomicMode=ALL&importReportMode=ERRORS"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', dhis2_fuente ~ '/metadatos/kit.json') | from_json }}"
    timeout: 300
  register: dhis2_import
  when: dhis2_kit_json is changed or dhis2_programa_hoy.status == 404
  changed_when: true
  failed_when: dhis2_import.json.status | default('') != 'OK'

- name: Cuentas existentes
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/users?fields=username&paging=false"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
  register: dhis2_cuentas_hoy
  no_log: true

# La clave solo se pone al crear la cuenta; después cada persona la cambia
- name: Cuentas locales del personal
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/users"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ item.usuario }}"
      password: "{{ dhis2_usuarios_password }}"
      firstName: "{{ item.nombres }}"
      surname: "{{ item.apellidos }}"
      userRoles: [{ id: "{{ item.rol }}" }]
      userGroups: [{ id: "{{ dhis2_grupo }}" }]
      organisationUnits: [{ id: "{{ dhis2_ou }}" }]
      dataViewOrganisationUnits: [{ id: "{{ dhis2_ou }}" }]
      teiSearchOrganisationUnits: [{ id: "{{ dhis2_ou }}" }]
    status_code: [200, 201]
  loop: "{{ dhis2_usuarios | rejectattr('usuario', 'in', dhis2_cuentas_hoy.json.users | map(attribute='username') | list) | list }}"
  loop_control:
    label: "{{ item.usuario }}"
  changed_when: true
  no_log: true

# kit.json define el grupo sin miembros, así que cada importación lo deja
# vacío; aquí se vuelve a meter a cada cuenta del personal
- name: Grupo de cada cuenta del personal
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/users?filter=username:in:[{{ dhis2_usuarios | map(attribute='usuario') | join(',') }}]&fields=id,username,userGroups[id]&paging=false"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
  register: dhis2_grupo_hoy
  no_log: true

- name: Cuentas del personal en el grupo "Personal clínico"
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/userGroups/{{ dhis2_grupo }}/users/{{ item.id }}"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
  loop: "{{ dhis2_grupo_hoy.json.users | rejectattr('userGroups', 'contains', {'id': dhis2_grupo}) | list }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: true

- name: Unidades de admin
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/me?fields=id,organisationUnits[id],teiSearchOrganisationUnits[id],dataViewOrganisationUnits[id]"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
  register: dhis2_admin_ou
  no_log: true

- name: admin captura y busca en la unidad del kit
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/users/{{ dhis2_admin_ou.json.id }}/{{ item }}/{{ dhis2_ou }}"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
  loop: [organisationUnits, teiSearchOrganisationUnits, dataViewOrganisationUnits]
  when: dhis2_ou not in (dhis2_admin_ou.json[item] | map(attribute='id') | list)
  changed_when: true
  no_log: true

- name: Pacientes ficticios presentes
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/tracker/trackedEntities/PacFict0001?fields=trackedEntity"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: dhis2_ficticios_hoy
  no_log: true

- name: Cargar los pacientes ficticios
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/tracker?async=false&importStrategy=CREATE_AND_UPDATE"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', dhis2_fuente ~ '/metadatos/pacientes-ficticios.json') | from_json }}"
    timeout: 300
  register: dhis2_ficticios
  when: dhis2_ficticios_hoy.status == 404
  changed_when: true
  failed_when: dhis2_ficticios.json.status | default('') != 'OK'

# Varias semanas de consultas para el dashboard de la brigada (apps#12). El
# archivo lo genera metadatos/generar-demostracion.py y se importa completo o
# nada (atomicMode ALL)
- name: Pacientes de demostración presentes
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/tracker/trackedEntities/PacDemo0001?fields=trackedEntity"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: dhis2_demostracion_hoy
  no_log: true

- name: Cargar los pacientes de demostración
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/tracker?async=false&importStrategy=CREATE_AND_UPDATE&atomicMode=ALL"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', dhis2_fuente ~ '/metadatos/pacientes-demostracion.json') | from_json }}"
    timeout: 600
  register: dhis2_demostracion
  when: dhis2_demostracion_hoy.status == 404
  changed_when: true
  failed_when: dhis2_demostracion.json.status | default('') != 'OK'

# Indicadores y dashboard de la brigada (apps#12)
- name: Metadatos de la brigada en la VM
  ansible.builtin.copy:
    src: "{{ dhis2_fuente }}/metadatos/brigada.json"
    dest: "{{ dhis2_dir }}/brigada.json"
    owner: root
    group: root
    mode: "0644"
  register: dhis2_brigada_json

- name: Indicadores de la brigada presentes
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/programIndicators/{{ dhis2_indicador_brigada }}?fields=id"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: dhis2_brigada_hoy
  no_log: true

- name: Importar los metadatos de la brigada
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/metadata?importStrategy=CREATE_AND_UPDATE&atomicMode=ALL&importReportMode=ERRORS"
    method: POST
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', dhis2_fuente ~ '/metadatos/brigada.json') | from_json }}"
    timeout: 300
  register: dhis2_brigada_import
  when: dhis2_brigada_json is changed or dhis2_brigada_hoy.status == 404
  changed_when: true
  failed_when: dhis2_brigada_import.json.status | default('') != 'OK'

# Tablas analíticas (apps#12, R-03). El trabajo continuo recalcula el periodo
# más reciente cada dhis2_analitica_cada segundos, y todo a la hora indicada.
# Sin datos agregados no hacen falta los valores atípicos; además, si no
# coinciden con los de la última generación, el trabajo no hace nada
# DHIS2 devuelve jobParameters completo; se comparan solo los que fija el rol
- name: Trabajo de las tablas analíticas hoy
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/jobConfigurations/{{ dhis2_analitica_trabajo }}?fields=id,delay,jobParameters"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: dhis2_analitica_hoy
  no_log: true

- name: Trabajo de las tablas analíticas
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/jobConfigurations{{ '' if dhis2_analitica_hoy.status == 404 else '/' ~ dhis2_analitica_trabajo }}"
    method: "{{ 'POST' if dhis2_analitica_hoy.status == 404 else 'PUT' }}"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      id: "{{ dhis2_analitica_trabajo }}"
      name: Tablas analíticas de la brigada
      jobType: CONTINUOUS_ANALYTICS_TABLE
      schedulingType: FIXED_DELAY
      delay: "{{ dhis2_analitica_cada }}"
      jobParameters: "{{ dhis2_analitica_parametros }}"
    status_code: [200, 201]
  when: >-
    dhis2_analitica_hoy.status == 404 or
    dhis2_analitica_hoy.json.delay != dhis2_analitica_cada or
    (dhis2_analitica_hoy.json.jobParameters | dict2items
     | selectattr('key', 'in', dhis2_analitica_parametros) | items2dict) != dhis2_analitica_parametros
  changed_when: true
  no_log: true

- name: SQL de la base de prerregistro en la VM
  ansible.builtin.copy:
    src: "{{ dhis2_fuente }}/prerregistro.sql"
    dest: "{{ dhis2_dir }}/prerregistro.sql"
    owner: root
    group: root
    mode: "0644"
  register: dhis2_prerregistro_sql

- name: Base de prerregistro presente
  ansible.builtin.command: >-
    docker exec dhis2-db-1 psql -U {{ dhis2_db_usuario }} -d {{ dhis2_db_nombre }} -tAc
    "SELECT 1 FROM pg_database WHERE datname = '{{ dhis2_prerregistro_db }}'"
  register: dhis2_prerregistro_hoy
  changed_when: false

# Se ejecuta si cambió el SQL o falta la base; el SQL es idempotente
- name: Base, tabla y roles de prerregistro
  ansible.builtin.shell: >-
    docker exec -i dhis2-db-1 psql -U {{ dhis2_db_usuario }} -d {{ dhis2_db_nombre }}
    -v ON_ERROR_STOP=1 -v clave="$CLAVE" -v clave_consultas="$CLAVE_CONSULTAS"
    < {{ dhis2_dir }}/prerregistro.sql
  environment:
    CLAVE: "{{ dhis2_prerregistro_password }}"
    CLAVE_CONSULTAS: "{{ dhis2_consultas_password }}"
  when: dhis2_prerregistro_sql is changed or dhis2_prerregistro_hoy.stdout != '1'
  changed_when: true
  no_log: true
