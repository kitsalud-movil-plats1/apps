---
- name: Directorio del Compose y de los datos
  ansible.builtin.file:
    path: "{{ dhis2_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Datos de PostgreSQL (los ajusta la imagen al arrancar)
  ansible.builtin.file:
    path: "{{ dhis2_dir }}/postgres"
    state: directory
    mode: "0700"

- name: Archivos de DHIS2, del usuario de la imagen
  ansible.builtin.file:
    path: "{{ dhis2_dir }}/files"
    state: directory
    owner: "{{ dhis2_uid }}"
    group: "{{ dhis2_uid }}"
    mode: "0750"

- name: Compose, dhis.conf y context.xml del repositorio apps
  ansible.builtin.copy:
    src: "{{ dhis2_fuente }}/{{ item }}"
    dest: "{{ dhis2_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [compose.yml, dhis.conf, context.xml]
  register: dhis2_archivos

- name: Variables y contraseña de la base desde el vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dhis2_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: dhis2_env

- name: pg_hba.conf de PostgreSQL
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ dhis2_dir }}/pg_hba.conf"
    owner: root
    group: root
    mode: "0644"
  register: dhis2_hba

- name: Levantar DHIS2
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ dhis2_dir }}"
  register: dhis2_up
  changed_when: dhis2_up.stderr is search('Creat|Recreat|Start')
  when: dhis2_estado == 'started'

# Los archivos van montados uno por uno: el contenedor solo ve la versión
# nueva después de reiniciarlo
- name: Reiniciar DHIS2 si cambió su configuración
  ansible.builtin.command: docker compose restart core
  args:
    chdir: "{{ dhis2_dir }}"
  when: dhis2_estado == 'started' and dhis2_archivos is changed and dhis2_up is not changed

- name: Reiniciar PostgreSQL si cambió pg_hba.conf
  ansible.builtin.command: docker compose restart db
  args:
    chdir: "{{ dhis2_dir }}"
  register: dhis2_db_reinicio
  when: dhis2_estado == 'started' and dhis2_hba is changed and dhis2_up is not changed

# /api/system/ping no toca la base: tras el reinicio, DHIS2 responde 401 a
# todos hasta que recupera sus conexiones, y la clave de admin parecería la
# de fábrica
- name: Esperar a que DHIS2 recupere la base
  ansible.builtin.uri:
    url: "{{ dhis2_api }}/me?fields=id"
    url_username: admin
    url_password: "{{ dhis2_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401, 502, 503]
  register: dhis2_me_reinicio
  until: dhis2_me_reinicio.status == 200
  retries: 30
  delay: 5
  when: dhis2_db_reinicio is changed
  no_log: true

- name: Detener DHIS2 (los datos quedan en {{ dhis2_dir }})
  ansible.builtin.command: docker compose down
  args:
    chdir: "{{ dhis2_dir }}"
  register: dhis2_down
  changed_when: dhis2_down.stderr is search('Remov|Stop')
  when: dhis2_estado == 'stopped'

- name: Clave de admin, metadatos, cuentas y pacientes ficticios
  ansible.builtin.import_tasks: configuracion.yml
  when: dhis2_estado == 'started'
