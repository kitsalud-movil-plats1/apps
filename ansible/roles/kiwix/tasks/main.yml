---
- name: Carpeta de medios
  ansible.builtin.file:
    path: "{{ kiwix_zim_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Los ZIM llegan del recurso contenido de clinica01 (platform#10), que los
# escribe con su usuario; por eso el rol no fija el dueño de la carpeta
- name: Carpeta de los ZIM
  ansible.builtin.file:
    path: "{{ kiwix_zim_dir }}"
    state: directory
    mode: "0755"

- name: Directorio del Compose
  ansible.builtin.file:
    path: "{{ kiwix_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Compose del repositorio apps
  ansible.builtin.copy:
    src: "{{ kiwix_fuente }}/compose.yml"
    dest: "{{ kiwix_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Levantar Kiwix
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ kiwix_dir }}"
  register: kiwix_up
  changed_when: kiwix_up.stderr is search('Creat|Recreat|Start')
  when: kiwix_estado == 'started'

- name: Detener Kiwix (los ZIM quedan en {{ kiwix_zim_dir }})
  ansible.builtin.command: docker compose down
  args:
    chdir: "{{ kiwix_dir }}"
  register: kiwix_down
  changed_when: kiwix_down.stderr is search('Remov|Stop')
  when: kiwix_estado == 'stopped'

- name: Reinicio de Kiwix cuando cambian los ZIM
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [kiwix-recarga.path, kiwix-recarga.service]
  register: kiwix_recarga

# Con Kiwix detenido no se vigila la carpeta, para no volver a levantarlo
- name: Vigilancia de la carpeta de ZIM
  ansible.builtin.systemd_service:
    name: kiwix-recarga.path
    enabled: "{{ kiwix_estado == 'started' }}"
    state: "{{ 'started' if kiwix_estado == 'started' else 'stopped' }}"
    daemon_reload: "{{ kiwix_recarga is changed }}"
