{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="angosto">
<h1>Consulta de prerregistros</h1>
<p>Entre con su usuario y contraseña del kit. Solo el personal clínico puede ver los prerregistros.</p>

{% if error %}<p class="aviso" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/entrar">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="usuario">Usuario <span class="nota">(por ejemplo, ana.rojas)</span></label>
  <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" maxlength="64" value="{{ usuario or '' }}" required autofocus>

  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required>

  <button type="submit">Entrar</button>
</form>
</div>
{% endblock %}
