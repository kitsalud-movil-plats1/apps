# Caddy en comunidad01 (D-16). Usa la red del host para escuchar en IPv4 e
# IPv6 con la IP real del cliente; los servicios quedan en 127.0.0.1.
name: caddy

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    network_mode: host
    volumes:
      # La carpeta y no el archivo, para que vea el Caddyfile nuevo al recargar
      - ./conf:/etc/caddy:ro
      - ./data:/data
      - ./config:/config
      # Raíz e intermedio de la CA del kit (apps#3); la raíz no lleva llave
      - ./pki:/pki:ro
    mem_limit: 256m
