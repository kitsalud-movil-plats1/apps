{% extends "base.html" %}
{% block titulo %}Registro recibido{% endblock %}
{% block contenido %}
<h1><span class="saludo">Listo,</span> {{ nombres }}</h1>
<img class="ilustracion" src="{{ url_for('static', filename='ilustraciones/espera.svg') }}" alt="">
<p class="centro">Recibimos sus datos. Su código es</p>
<p class="codigo" aria-label="Código {{ codigo | join(' ') }}">{{ codigo }}</p>
<p class="centro nota">Guarde este código o tómele una foto. El personal de salud lo va a llamar por él.</p>
<a class="boton secundario" href="/">Registrar a otra persona</a>
{% endblock %}
