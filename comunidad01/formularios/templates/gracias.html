{% extends "base.html" %}
{% block titulo %}Registro recibido{% endblock %}
{% block contenido %}
<div class="listo">
<div class="sello"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h1>Listo, {{ nombres }}</h1>
<p>Recibimos sus datos. Su código es</p>
<p class="codigo" aria-label="Código {{ codigo | join(' ') }}">{{ codigo }}</p>
<p>Guarde este código o tómele una foto. El personal de salud lo va a llamar por él.</p>
</div>
<p><a class="boton secundario" href="/">Registrar a otra persona</a></p>
{% endblock %}
